name: Refresh Paris data

# Keeps the site honest: drops events that have already happened and
# fails the build if any record is malformed. Runs every morning so the
# page never shows something that finished yesterday.

on:
  schedule:
    - cron: '10 4 * * *'      # 04:10 UTC — ~06:10 Paris in summer
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - 'data/**'
      - 'scripts/refresh.mjs'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # On a pull request we only validate; we never rewrite someone's branch.
      - name: Validate data
        if: github.event_name == 'pull_request'
        run: node scripts/refresh.mjs --check

      - name: Prune expired entries and validate
        if: github.event_name != 'pull_request'
        run: node scripts/refresh.mjs

      - name: Commit any changes
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing changed — no events expired today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: prune expired events ($(date -u +%Y-%m-%d))"
          git push
