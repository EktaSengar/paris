name: Refresh Paris data

# Keeps the site honest: drops events that have already happened and
# fails the build if any record is malformed. Runs every morning so the
# page never shows something that finished yesterday.

on:
  schedule:
    - cron: '10 4 * * *'      # 04:10 UTC — ~06:10 Paris in summer
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - 'data/**'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # On a pull request we only validate; we never rewrite someone's branch.
      - name: Validate data
        if: github.event_name == 'pull_request'
        run: node scripts/refresh.mjs --check

      - name: Prune expired entries and validate
        if: github.event_name != 'pull_request'
        run: node scripts/refresh.mjs

      # OpenStreetMap does not change fast enough to justify a daily crawl,
      # and Overpass throttles hard. Mondays only.
      - name: Refresh the discovery index (weekly)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            node scripts/discover.mjs || echo "discovery skipped — Overpass unavailable"
            node scripts/geocode.mjs  || echo "geocoding skipped"
            node scripts/civic.mjs    || echo "civic data skipped — opendata.paris.fr unavailable"
            node scripts/notable.mjs  || echo "notable layer skipped — Wikidata unavailable"
          else
            echo "not Monday — discovery index left alone"
          fi

      # The "is it open" filter acts on a parser that deliberately refuses
      # what it cannot read. This fails if the share of Paris it can read
      # drops below the floor — which would make the filter unsafe to act
      # on long before anything looked wrong on the page.
      - name: Check the opening-hours parser still covers the city
        run: node scripts/check-hours.mjs

      # editorial.json is hand-written and carries no coordinates; this checks
      # every record still points at a place that exists.
      - name: Check the hand-written records still resolve
        run: node scripts/editorial.mjs --check

      # The site can look completely healthy while location silently fails to
      # reach the retrieval layer — the whole page renders, every distance is
      # right, and the recommendations are somebody else's neighbourhood. This
      # catches that, and runs after any discovery refresh so it also notices
      # a rebuilt index that has quietly lost coverage somewhere.
      - name: Check that location changes the recommendations
        run: node scripts/check-location.mjs

      # Pages serves assets with max-age=600, so without content-hashed URLs a
      # returning browser can pair new HTML with ten-minute-old CSS and JS.
      - name: Stamp asset URLs
        run: node scripts/version.mjs

      - name: Commit any changes
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain data index.html)" ]; then
            echo "Nothing changed — no events expired and assets already stamped."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "chore: prune expired events and restamp assets ($(date -u +%Y-%m-%d))"
          git push
