name: Performance report

# How long does this page make somebody wait, and has that got worse.
#
# Weekly rather than per-push, because the thing this is guarding against
# is drift rather than any single commit. The discovery index and the
# events file are regenerated by the refresh workflow on their own
# schedule, so the page can get heavier with nobody having touched the
# code — and that is exactly the regression nobody notices.
#
# Reports; never fails. A Lighthouse score has real run-to-run variance,
# and a red check that is sometimes just noise is a check people learn to
# scroll past. The numbers land in the job summary to be read. The byte
# counts in them are exact, and that is usually where a real regression
# shows up first anyway.

on:
  schedule:
    - cron: '20 5 * * 1'      # 05:20 UTC Monday — after the daily refresh
  workflow_dispatch:           # or by hand, from the Actions tab

permissions:
  contents: read

concurrency:
  group: perf
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ubuntu-latest ships Chrome. Point the harness at it explicitly
      # rather than letting chrome-launcher guess, so a runner image
      # change fails loudly here instead of silently measuring nothing.
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome on this runner — cannot measure." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      # Optional, and only used for the interaction-latency row. Kept
      # --no-save so the repo stays dependency-free.
      - name: Interaction timing support
        run: npm install --no-save puppeteer-core

      # The stamps have to be current or the page asks for data URLs that
      # no longer match the files, which would measure a broken site.
      - name: Check asset stamps are current
        run: node scripts/version.mjs --check

      - name: Measure
        run: |
          node scripts/check-perf.mjs \
            --runs 5 --inp \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --json > perf-result.json
          echo "--- console ---"
          node -e "
            const r = require('./perf-result.json');
            const worse = r.comparison.filter(c => c.verdict === 'worse');
            console.log(worse.length
              ? 'Worse than baseline: ' + worse.map(c => c.label).join(', ')
              : 'Nothing has regressed.');
          "

      - name: Keep the numbers
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_number }}
          path: perf-result.json
          retention-days: 90
